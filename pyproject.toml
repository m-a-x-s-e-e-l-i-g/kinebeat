[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kinebeat"
version = "0.1.0"
description = "Generate editable music-driven video timelines from local footage."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Max Seelig" }]
dependencies = [
  "av>=14.0.0",
  "numpy>=2.0.0",
  "PySide6>=6.8.0",
]

[project.optional-dependencies]
analysis = [
  "demucs>=4.1.0,<5",
  "librosa>=0.11.0,<2",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]
build = [
  "pyinstaller>=6.21.0,<7",
]

[project.scripts]
kinebeat = "kinebeat.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kinebeat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
